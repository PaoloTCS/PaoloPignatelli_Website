<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The intellectual property network of Paul Pignatelli and Litchfield Capital Corporation — interactive domain graph.">
    <title>The Network — Paolo Pignatelli</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="theme-dark">
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <a href="index.html" class="nav-logo-text"><h1>Paolo Pignatelli</h1></a>
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="linguistics.html" class="nav-link">Linguistics</a></li>
                    <li><a href="philosophy.html" class="nav-link">Philosophy</a></li>
                    <li><a href="related-sites.html" class="nav-link active">Network</a></li>
                    <li><a href="protocols.html" class="nav-link">Protocols</a></li>
                </ul>
                <div class="hamburger" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </nav>
    </header>

    <main class="network-page-main">
        <div class="network-intro">
            <h1 class="network-title">The Network</h1>
            <p class="network-subtitle">Click any node for details and theme overlaps with other sites</p>
        </div>
        <div class="network-layout">
            <div class="network-graph-wrap" id="graph-wrap">
                <svg id="network-svg" aria-label="Domain network graph"></svg>
            </div>
            <aside class="network-panel" id="network-panel" aria-live="polite">
                <p class="panel-placeholder" id="panel-placeholder">Node details will appear here.</p>
                <div id="panel-detail" hidden></div>
            </aside>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="script.js"></script>
    <script>
(function () {
    const DOMAINS = [
        { id: 'paolo', name: 'Paolo Pignatelli', domain: 'paolopignatelli.com', url: 'https://paolopignatelli.com', type: 'root', color: '#c9a84c', radius: 26, desc: 'Central hub: personal and professional front door. Physicist, theorist, founder.', repo: 'https://github.com/PaoloTCS/PaoloPignatelli_Website', similar: [
            { id: 'verbum', note: 'R&D results and frameworks are summarized here; the hub points to deeper technical work there.' },
            { id: 'cornerstore', note: 'Same long-running business thread: public hub vs. legacy commercial storefront.' },
            { id: 'litchfield', note: 'Corporate structure behind research, commerce, and technology holdings.' },
            { id: 'collaborativ', note: 'AI collaboration stack is part of the same intellectual network as the hub.' }
        ] },
        { id: 'verbum', name: 'Verbum Technologies', domain: 'verbumtechnologies.com', url: 'https://verbumtechnologies.com', type: 'ai', color: '#4a9eff', radius: 18, desc: 'Primary R&D surface: FIL, Computational Relativity, PaoloLab — expect frequent updates.', repo: 'https://github.com/PaoloTCS/VerbumTechnologiesWebsite', similar: [
            { id: 'paolo', note: 'Hub explains who and why; Verbum hosts evolving technical substance.' },
            { id: 'collaborativ', note: 'Shared AI-infrastructure and consensus themes with the lab.' },
            { id: 'collaborativeai', note: 'Adjacent collaborative-research positioning; both extend multi-agent work.' },
            { id: 'familiaai', note: 'Applied intelligence products trace back to the same R&D lineage.' },
            { id: 'computednews', note: 'Technology news curation overlaps Verbum’s focus on tools and ideas in the wild.' }
        ] },
        { id: 'collaborativ', name: 'Collaborativ.AI', domain: 'collaborativ.ai', url: 'https://collaborativ.ai', type: 'ai', color: '#4a9eff', radius: 16, desc: 'Multi-AI consensus and knowledge convergence platform.', similar: [
            { id: 'verbum', note: 'Upstream R&D feeds the consensus and tooling story.' },
            { id: 'collaborativeai', note: 'Closest sibling product: collaborative AI workflows and research.' },
            { id: 'familiaai', note: 'Same AI portfolio; different audience (teams vs. families).' },
            { id: 'paolo', note: 'Hub ties the public narrative to these platforms.' }
        ] },
        { id: 'collaborativeai', name: 'CollaborativeAI', domain: 'collaborativeai.ai', url: 'https://collaborativeai.ai', type: 'ai', color: '#4a9eff', radius: 14, desc: 'Extended AI-human collaborative research platform.', repo: 'https://github.com/PaoloTCS/CollaborativeAI', similar: [
            { id: 'collaborativ', note: 'Shared DNA: multi-agent collaboration and convergence.' },
            { id: 'verbum', note: 'Research outputs and prototypes surface through Verbum’s R&D channel.' },
            { id: 'familiaai', note: 'Parallel product line under the same AI umbrella.' },
            { id: 'paolo', note: 'Personal hub positions the whole AI cluster.' }
        ] },
        { id: 'familiaai', name: 'FamiliaAI', domain: 'familiaai.com', url: 'https://familiaai.com', type: 'ai', color: '#4a9eff', radius: 14, desc: 'AI for families. Privacy-first ambient intelligence.', repo: 'https://github.com/PaoloTCS/Familiaai', similar: [
            { id: 'collaborativ', note: 'Same platform family; FamiliaAI targets home and privacy use cases.' },
            { id: 'collaborativeai', note: 'Human–AI collaboration themes with a consumer focus.' },
            { id: 'verbum', note: 'Underlying models and research are developed under the Verbum R&D umbrella.' },
            { id: 'paolo', note: 'Announced and contextualized from the central site.' }
        ] },
        { id: 'litchfield', name: 'Litchfield Capital', domain: 'litchfieldcapitalcorporation.com', url: 'https://litchfieldcapitalcorporation.com', type: 'corporate', color: '#c9a84c', radius: 18, desc: 'Parent corporation. Est. 1992. Research, investment, technology.', repo: 'https://github.com/PaoloTCS/LitchfieldCapitalCorporation', similar: [
            { id: 'paolo', note: 'Personal brand sits inside the broader corporate portfolio.' },
            { id: 'verbum', note: 'R&D entity under the same holding structure.' },
            { id: 'cornerstore', note: 'Operational continuity since 1992: licensing and services alongside research and media.' }
        ] },
        { id: 'cornerstore', name: 'The Corner Store', domain: 'thecornerstore.com', url: 'https://thecornerstore.com', type: 'commerce', color: '#ff7f4a', radius: 16, desc: 'Ongoing commercial site since 1992 (e.g. Microsoft licensing). Distinct from the R&D-heavy properties.', repo: 'https://github.com/PaoloTCS/TheCornerStore', similar: [
            { id: 'paolo', note: 'Hub is the public face; Corner Store is the durable business presence.' },
            { id: 'litchfield', note: 'Corporate parent for the legacy commercial operation.' },
            { id: 'verbum', note: 'Where new technology is explored; Corner Store is day-to-day commerce.' }
        ] },
        { id: 'computednews', name: 'Computed News', domain: 'computednews.com', url: 'https://computednews.com', type: 'media', color: '#4aff9a', radius: 14, desc: 'Algorithmically curated technology news.', repo: 'https://github.com/PaoloTCS/ComputedNews', similar: [
            { id: 'verbum', note: 'Tech coverage complements Verbum’s first-party R&D publishing.' },
            { id: 'intlmirrors', note: 'Both emphasize global information flow and curation.' },
            { id: 'polcorner', note: 'News and politics verticals share editorial tooling and audience curiosity.' },
            { id: 'paolo', note: 'Media cluster is linked from the central hub.' }
        ] },
        { id: 'intlmirrors', name: 'International Mirrors', domain: 'internationalmirrors.com', url: 'https://internationalmirrors.com', type: 'media', color: '#4aff9a', radius: 14, desc: 'Global information exchange platform.', repo: 'https://github.com/PaoloTCS/internationalmirrors.com', similar: [
            { id: 'computednews', note: 'Sibling media property: algorithms and breadth vs. depth.' },
            { id: 'polcorner', note: 'Current-events and civic angles overlap for informed readers.' },
            { id: 'paolo', note: 'Part of the outward-facing media ring around the hub.' }
        ] },
        { id: 'polcorner', name: 'Political Corner', domain: 'politicalcorner.com', url: 'https://politicalcorner.com', type: 'media', color: '#4aff9a', radius: 13, desc: 'Evidence-based political analysis.', repo: 'https://github.com/PaoloTCS/PoliticalCorner', similar: [
            { id: 'computednews', note: 'Shared emphasis on evidence, sources, and technology’s role in news.' },
            { id: 'intlmirrors', note: 'International framing meets domestic political analysis.' },
            { id: 'paolo', note: 'Listed from the hub as part of the media network.' }
        ] }
    ];

    const EDGES = [
        { source: 'paolo', target: 'verbum', strength: 0.9 },
        { source: 'paolo', target: 'litchfield', strength: 0.8 },
        { source: 'paolo', target: 'collaborativ', strength: 0.7 },
        { source: 'paolo', target: 'collaborativeai', strength: 0.6 },
        { source: 'paolo', target: 'familiaai', strength: 0.6 },
        { source: 'paolo', target: 'cornerstore', strength: 0.6 },
        { source: 'paolo', target: 'computednews', strength: 0.5 },
        { source: 'paolo', target: 'intlmirrors', strength: 0.5 },
        { source: 'paolo', target: 'polcorner', strength: 0.4 },
        { source: 'verbum', target: 'collaborativ', strength: 0.6 },
        { source: 'verbum', target: 'collaborativeai', strength: 0.5 },
        { source: 'verbum', target: 'familiaai', strength: 0.5 },
        { source: 'litchfield', target: 'cornerstore', strength: 0.6 },
        { source: 'litchfield', target: 'verbum', strength: 0.7 },
        { source: 'collaborativ', target: 'collaborativeai', strength: 0.8 },
        { source: 'computednews', target: 'intlmirrors', strength: 0.4 },
        { source: 'computednews', target: 'polcorner', strength: 0.3 }
    ];

    const svgEl = document.getElementById('network-svg');
    const wrap = document.getElementById('graph-wrap');
    const panel = document.getElementById('network-panel');
    const panelPh = document.getElementById('panel-placeholder');
    const panelDetail = document.getElementById('panel-detail');

    const domainById = {};
    DOMAINS.forEach(function (x) {
        domainById[x.id] = x;
    });

    const nodes = DOMAINS.map(function (d) { return Object.assign({}, d); });
    const links = EDGES.map(function (e) { return Object.assign({}, e); });

    function showPanel(d) {
        panelPh.hidden = true;
        panelDetail.hidden = false;
        panelDetail.replaceChildren();
        var h3 = document.createElement('h3');
        h3.textContent = d.name;
        var dom = document.createElement('p');
        dom.className = 'panel-domain';
        dom.textContent = d.domain;
        var desc = document.createElement('p');
        desc.className = 'panel-desc';
        desc.textContent = d.desc;
        var linksWrap = document.createElement('div');
        linksWrap.className = 'panel-links';
        var a = document.createElement('a');
        a.className = 'panel-link';
        a.href = d.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = 'Visit site →';
        linksWrap.appendChild(a);
        if (d.repo) {
            var r = document.createElement('a');
            r.className = 'panel-link panel-link-repo';
            r.href = d.repo;
            r.target = '_blank';
            r.rel = 'noopener noreferrer';
            r.textContent = 'View repository →';
            linksWrap.appendChild(r);
        }
        panelDetail.append(h3, dom, desc, linksWrap);

        if (d.similar && d.similar.length) {
            var simH = document.createElement('h4');
            simH.className = 'panel-similar-heading';
            simH.textContent = 'Theme overlaps';
            var simP = document.createElement('p');
            simP.className = 'panel-similar-intro';
            simP.textContent = 'How this site relates to others in the network (curated; not automatic embedding).';
            var ul = document.createElement('ul');
            ul.className = 'panel-similar-list';
            d.similar.forEach(function (s) {
                var other = domainById[s.id];
                if (!other) return;
                var li = document.createElement('li');
                var row = document.createElement('div');
                row.className = 'panel-similar-row';
                var title = document.createElement('div');
                title.className = 'panel-similar-title';
                var nameBtn = document.createElement('button');
                nameBtn.type = 'button';
                nameBtn.className = 'panel-similar-name';
                nameBtn.textContent = other.name;
                nameBtn.setAttribute('aria-label', 'Open details for ' + other.name);
                nameBtn.addEventListener('click', function () {
                    showPanel(other);
                });
                var domSmall = document.createElement('span');
                domSmall.className = 'panel-similar-domain';
                domSmall.textContent = other.domain;
                title.append(nameBtn, domSmall);
                var note = document.createElement('p');
                note.className = 'panel-similar-note';
                note.textContent = s.note;
                row.append(title, note);
                li.appendChild(row);
                ul.appendChild(li);
            });
            panelDetail.append(simH, simP, ul);
        }
    }

    function resetPanel() {
        panelPh.hidden = false;
        panelDetail.hidden = true;
        panelDetail.replaceChildren();
    }

    function sizeSvg() {
        const w = wrap.clientWidth || 600;
        const h = Math.max(480, Math.min(window.innerHeight - 220, 720));
        const s = d3.select(svgEl);
        s.attr('viewBox', [0, 0, w, h]).attr('width', w).attr('height', h);
        s.select('rect.network-bg').attr('width', w).attr('height', h);
        return { w: w, h: h };
    }

    let { w, h } = sizeSvg();

    const svg = d3.select(svgEl);
    svg.append('rect')
        .attr('class', 'network-bg')
        .attr('width', w)
        .attr('height', h)
        .attr('fill', '#0a0e1a')
        .on('click', resetPanel);
    const gRoot = svg.append('g');

    const linkG = gRoot.append('g').attr('stroke', 'rgba(201,168,76,0.22)').attr('stroke-linecap', 'round');
    const nodeG = gRoot.append('g');
    const labelG = gRoot.append('g');

    const linkSel = linkG
        .selectAll('line')
        .data(links)
        .join('line')
        .attr('stroke-width', function (d) { return 1 + d.strength * 2.5; })
        .attr('pointer-events', 'none');

    const nodeSel = nodeG
        .selectAll('circle')
        .data(nodes)
        .join('circle')
        .attr('r', function (d) { return d.radius; })
        .attr('fill', function (d) { return d.color; })
        .attr('stroke', 'rgba(10,14,26,0.85)')
        .attr('stroke-width', 2)
        .style('cursor', 'grab')
        .on('click', function (event, d) {
            event.stopPropagation();
            showPanel(d);
        });

    const labelSel = labelG
        .selectAll('text')
        .data(nodes)
        .join('text')
        .attr('class', 'node-label')
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'hanging')
        .attr('pointer-events', 'none')
        .text(function (d) {
            return d.id === 'paolo' ? 'paolopignatelli.com' : d.domain;
        });

    const simulation = d3
        .forceSimulation(nodes)
        .force(
            'link',
            d3
                .forceLink(links)
                .id(function (d) { return d.id; })
                .strength(function (d) { return d.strength * 0.65; })
                .distance(function (d) { return 90 - d.strength * 35; })
        )
        .force('charge', d3.forceManyBody().strength(-240))
        .force('center', d3.forceCenter(w / 2, h / 2))
        .force(
            'collide',
            d3.forceCollide().radius(function (d) {
                return d.radius + 10;
            })
        );

    function dragstarted(event) {
        if (!event.active) simulation.alphaTarget(0.35).restart();
        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
    }
    function dragged(event) {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
    }
    function dragended(event) {
        if (!event.active) simulation.alphaTarget(0);
        event.subject.fx = null;
        event.subject.fy = null;
    }

    nodeSel.call(
        d3.drag().on('start', dragstarted).on('drag', dragged).on('end', dragended)
    );

    simulation.on('tick', function () {
        linkSel
            .attr('x1', function (d) { return d.source.x; })
            .attr('y1', function (d) { return d.source.y; })
            .attr('x2', function (d) { return d.target.x; })
            .attr('y2', function (d) { return d.target.y; });

        nodeSel.attr('cx', function (d) { return d.x; }).attr('cy', function (d) { return d.y; });

        labelSel
            .attr('x', function (d) { return d.x; })
            .attr('y', function (d) { return d.y + d.radius + 6; });
    });

    window.addEventListener(
        'resize',
        debounce(function () {
            const s = sizeSvg();
            w = s.w;
            h = s.h;
            simulation.force('center', d3.forceCenter(w / 2, h / 2));
            simulation.alpha(0.35).restart();
        }, 200)
    );

    function debounce(fn, ms) {
        let t;
        return function () {
            clearTimeout(t);
            const a = arguments;
            const self = this;
            t = setTimeout(function () { fn.apply(self, a); }, ms);
        };
    }
})();
    </script>
</body>
</html>
